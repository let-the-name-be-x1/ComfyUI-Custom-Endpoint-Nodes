[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-endpoint-nodes"
version = "0.5.2"
description = "ComfyUI nodes that call GPT / Gemini / Grok / Qwen image and text models through a user-supplied API endpoint (official API, relay or private proxy)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Intentionally empty: ComfyUI already ships torch/numpy/Pillow, and declaring
# them here makes ComfyUI Manager try to pip-install and can replace the user's
# CUDA build with a CPU one.
dependencies = []

[project.urls]
Repository = "https://github.com/let-the-name-be-x1/ComfyUI-Custom-Endpoint-Nodes"
"Bug Tracker" = "https://github.com/let-the-name-be-x1/ComfyUI-Custom-Endpoint-Nodes/issues"

[tool.comfy]
PublisherId = "let-the-name-be-x1"
DisplayName = "Custom Endpoint API Nodes"
web = "custom_endpoint/web"
